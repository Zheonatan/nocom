name: Build

# Dispara ao empurrar uma tag `v*` (ex.: v0.1.0) ou manualmente pela aba Actions.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# tauri-action cria/atualiza a release e sobe os instaladores nela.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # **Um job por vez, e é o updater que cobra isso.** Cada job faz merge da
      # própria plataforma no MESMO `latest.json` da release: em paralelo, dois
      # que leem a versão antiga do arquivo e escrevem em seguida apagam a
      # entrada um do outro, e o sintoma é uma plataforma que nunca acha
      # atualização. O preço é a release levar a soma dos quatro builds em vez do
      # mais longo — algumas vezes por mês, com o cache do Rust quente.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            rotulo: macOS (Apple Silicon)
          - platform: macos-latest
            target: x86_64-apple-darwin
            rotulo: macOS (Intel)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rotulo: Linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rotulo: Windows

    name: ${{ matrix.rotulo }}
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      # WebKitGTK 4.1 é o webview do Tauri v2 no Linux; libayatana-appindicator
      # atende a feature `tray-icon`, e libxdo o atalho global.
      - name: Dependências do sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            patchelf \
            wget

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}

      - name: Instalar dependências do front
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A chave que assina os pacotes de atualização (Adendo 10). O app só
          # instala o que foi assinado com ela — é a assinatura, e não o HTTPS,
          # que decide o que vira `/Applications/NoCom.app`.
          #
          # Sem estas duas o build FALHA, porque `createUpdaterArtifacts` está
          # ligado no `tauri.conf.json`. É de propósito: publicar uma release sem
          # os `.sig` deixaria quem já instalou sem caminho de atualização, e um
          # build vermelho é um jeito melhor de descobrir isso do que um usuário
          # reportando meses depois.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # **Assinatura ad-hoc do macOS — outra coisa, apesar do nome parecido.**
          # A de cima assina o pacote de ATUALIZAÇÃO; esta assina o `.app`, e é o
          # Gatekeeper quem confere.
          #
          # Sem ela o bundle sai apenas *linker-signed*: a assinatura que o próprio
          # linker embute no binário, e que não sela os recursos do bundle. O efeito
          # é que `codesign --verify` REPROVA (`code has no resources but signature
          # indicates they must be present`), e o Gatekeeper para no erro de
          # assinatura antes de chegar a avaliar a política. Quando isso acontece o
          # macOS não diz "desenvolvedor não identificado" — diz que o app **"está
          # danificado e deve ser movido para o Lixo"**, que é a mesma frase de um
          # download corrompido e leva o usuário a apagar o app.
          #
          # `-` é a identidade ad-hoc: assina sem certificado nenhum, de graça. Com
          # ela a assinatura fecha (`valid on disk`, recursos selados) e o Gatekeeper
          # passa a avaliar a política de verdade, caindo no aviso normal de app não
          # notarizado — que tem saída pela interface, ao contrário do "danificado".
          #
          # **Não substitui notarização.** O app continua bloqueado no primeiro
          # clique; o que muda é a mensagem e o fato de existir um caminho de volta.
          # Sair disso de vez pede um certificado Developer ID (US$ 99/ano) em
          # `APPLE_CERTIFICATE` + notarização via `APPLE_ID`/`APPLE_TEAM_ID`.
          #
          # Isto liga o hardened runtime junto (padrão do bundler ao assinar). O
          # WebView do Tauri roda sem entitlements extras — conferido na 0.4.0.
          #
          # Vazio fora do macOS: os bundlers de Windows e Linux não leem esta
          # variável, e deixar explícito evita a dúvida de quem lê o workflow.
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && '-' || '' }}
        with:
          args: --target ${{ matrix.target }}
          tagName: v__VERSION__
          releaseName: NoCom v__VERSION__
          releaseBody: "Instaladores para Windows, macOS e Linux gerados automaticamente."
          # Publica direto: um draft não tem URL estável, e o cask do Homebrew
          # baixa de /releases/download/v<versão>/.
          releaseDraft: false
          prerelease: false
          # O `latest.json` que o app consulta. Sobe como asset da release, e é o
          # que o endpoint do `tauri.conf.json` aponta via
          # `/releases/latest/download/`. Já é o padrão; explícito porque é a peça
          # sem a qual o botão de atualizar não acha nada.
          includeUpdaterJson: true
          # **O Windows atualiza pelo `-setup.exe`, e não pelo `.msi`.** O padrão da
          # action é o contrário (`false`, por legado), e com `targets: "all"` os dois
          # são gerados — então sem esta linha o `latest.json` aponta para o MSI, que
          # instala via `msiexec` com elevação: um UAC a cada atualização, e nenhuma
          # atualização possível para quem não é administrador da máquina. O NSIS
          # deste projeto instala em modo `currentUser` (o padrão do bundler), que não
          # pede elevação nenhuma.
          updaterJsonPreferNsis: true

  # Publica nos gerenciadores de pacote. Só em tag: num `workflow_dispatch` a
  # partir da main o `if` pula, porque um build de teste não deve mexer no que os
  # usuários instalam.
  #
  # `needs: build` espera a matriz INTEIRA, e não só o job do Windows ou do
  # macOS: os jobs de lá leem os instaladores da release, que só existem depois
  # que o último job da matriz subiu os seus.
  #
  # Mora num workflow separado para poder ser disparado à mão em cima de uma tag
  # já publicada — ver o cabeçalho de `gerenciadores.yml`.
  gerenciadores:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/gerenciadores.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
