name: Build

# Dispara ao empurrar uma tag `v*` (ex.: v0.1.0) ou manualmente pela aba Actions.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# tauri-action cria/atualiza a release e sobe os instaladores nela.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            rotulo: macOS (Apple Silicon)
          - platform: macos-latest
            target: x86_64-apple-darwin
            rotulo: macOS (Intel)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rotulo: Linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rotulo: Windows

    name: ${{ matrix.rotulo }}
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # WebKitGTK 4.1 é o webview do Tauri v2 no Linux; libayatana-appindicator
      # atende a feature `tray-icon`, e libxdo o atalho global.
      - name: Dependências do sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            patchelf \
            wget

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}

      - name: Instalar dependências do front
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          tagName: v__VERSION__
          releaseName: Mini To-Do v__VERSION__
          releaseBody: "Instaladores para Windows, macOS e Linux gerados automaticamente."
          # Publica direto: um draft não tem URL estável, e o cask do Homebrew
          # baixa de /releases/download/v<versão>/.
          releaseDraft: false
          prerelease: false
