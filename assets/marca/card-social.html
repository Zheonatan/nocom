<!doctype html>
<!-- Fonte do card de compartilhamento do repositório (`card-social.png`),
     1280x640 -- a imagem que o GitHub, o Slack e o Twitter mostram quando
     alguém cola o link. Ela NÃO aparece em página nenhuma do projeto: é subida
     à mão em Settings > General > Social preview.

     O PNG está versionado ao lado, e este arquivo existe para ele não ficar
     órfão de quem o gerou. Para regerar depois de mudar qualquer coisa aqui,
     com o Chrome de cabeça vazia:

       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
         --headless --disable-gpu --window-size=1280,640 \
         --screenshot=assets/marca/card-social.png \
         --virtual-time-budget=3000 assets/marca/card-social.html

     O Chrome grava o PNG e às vezes não encerra sozinho; um Ctrl-C depois de o
     arquivo aparecer não prejudica a imagem.

     A fonte é a Geist variável do próprio app, lida do `node_modules` para o
     card sair igual num clone novo. O anel repete as frações canônicas de
     `nocom.svg` -- ver DESIGN.md, "A Marca". -->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>NoCom — card</title>
    <style>
      @font-face {
        font-family: "Geist";
        src: url("../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-display: block;
      }
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 640px; }
      body {
        /* O campo preto da marca, sangrando até a borda: o card É a marca em
           tamanho grande, e não um retângulo branco com o logo num canto. */
        background: #000;
        color: #fff;
        font-family: "Geist", system-ui, sans-serif;
        /* Pilha centrada, e não anel à esquerda com texto à direita: no Slack
           este card chega com ~600px de largura, e uma composição centrada
           sobrevive à redução melhor que duas colunas. */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 96px;
      }
      .anel {
        /* Frações canônicas de `assets/marca/nocom.svg` — diâmetro externo 0,62
           do campo e traço campo/64 — preservadas pelo viewBox. Em 182px de
           campo o fio sai com ~2,8px: fino de propósito, e é a razão de o anel
           não competir com o nome logo abaixo. */
        width: 182px;
        height: 182px;
        /* 24px, e não 52: o `line-height: 1` do nome já traz entrelinha interna,
           e a folga MEDIDA entre o anel e o topo dos glifos é bem maior que o
           número escrito aqui. */
        margin-bottom: 24px;
      }
      h1 {
        font-size: 104px;
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1;
      }
      p {
        margin-top: 26px;
        font-size: 37px;
        font-weight: 400;
        line-height: 1.3;
        letter-spacing: -0.012em;
        /* Cinza, e não branco: a tagline é subordinada ao nome, e dois brancos
           puros lado a lado brigam pela mesma atenção. */
        color: #a3a3a3;
      }
      .rodape {
        margin-top: 54px;
        font-size: 25px;
        letter-spacing: 0.04em;
        color: #6e6e6e;
        /* Uma linha só. Se ela quebrar, o card ganha um degrau assimétrico
           embaixo que estraga o eixo central. */
        white-space: nowrap;
      }
      .rodape b {
        font-weight: 500;
        color: #b4b4b4;
      }
      .rodape i {
        font-style: normal;
        /* Separador mais apagado que os termos que ele separa. */
        color: #3f3f3f;
        padding: 0 18px;
      }
    </style>
  </head>
  <body>
    <svg class="anel" viewBox="0 0 1024 1024" role="img" aria-label="NoCom">
      <circle cx="512" cy="512" r="309.44" fill="none" stroke="#fff" stroke-width="16" />
    </svg>
    <h1>NoCom</h1>
    <p>Uma lista de tarefas que vive por cima do seu trabalho.</p>
    <div class="rodape">
      <b>⌃⌥T</b><i>·</i>macOS, Windows e Linux<i>·</i>sem conta, sem nuvem
    </div>
  </body>
</html>
