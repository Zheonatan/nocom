[package]
name = "nocom"
version = "0.4.0"
description = "Uma lista de tarefas que vive por cima do seu trabalho"
authors = ["Ruan A."]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nocom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` é o que faz `transparent: true` valer no macOS; sem ela a
# janela sobe opaca. Anda em par com `app.macOSPrivateApi` no tauri.conf.json, e
# o preço é conhecido: um app que a usa não entra na Mac App Store.
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }

# Dialogos de salvar/abrir do exportar e importar (Adendo 13). O frontend so
# pede o caminho; quem le e grava o arquivo e o backend, pela persistencia
# atomica de sempre.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

# Idioma do sistema, para o tray falar a mesma lingua que a janela. A janela le
# `navigator.languages` na webview; o tray e desenhado pelo Rust antes de a
# webview existir, e por isso precisa da propria leitura. E a mesma crate que o
# `tauri-plugin-os` usa por dentro, sem dependencia nenhuma no desktop -- o
# plugin inteiro entraria aqui para expor uma funcao so.
sys-locale = "0.3"

# `nl_langinfo(D_FMT)`, para ler a ordem de dia e mes do formato de data do
# sistema (ver formato.rs). So no Linux: no macOS e no Windows a leitura e uma
# chamada de framework declarada a mao, e nao precisa de crate. A libc ja esta na
# arvore por baixo de meia duzia de dependencias do Tauri -- declara-la aqui nao
# acrescenta pacote nenhum, e o que ela da em troca e o valor certo de `D_FMT`,
# que glibc e musl nao definem igual.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Atalho global (Control+Option+T). Fica sob um alvo de desktop porque atalho de
# sistema nao existe em Android nem iOS: como dependencia comum, o plugin entraria
# na compilacao mobile so para nao poder ser usado.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.3.2"

# Segunda instancia mostra a janela (Adendo 12). Relancar o app pelo launcher e o
# gesto de quem perdeu a janela — no Linux, onde atalho e bandeja podem faltar ao
# mesmo tempo, e a via de volta que sobra; nos outros dois, e conveniencia. So
# desktop, pela mesma razao dos vizinhos: mobile nao tem segunda instancia.
tauri-plugin-single-instance = "2"

# Iniciar com o sistema (Adendo 13): a promessa do atalho global quebra em
# silencio no primeiro reinicio da maquina se o processo nao subir junto. So
# desktop, pela mesma razao dos vizinhos: mobile nao tem "iniciar no login".
tauri-plugin-autostart = "2"

# Atualizacao pelo proprio app (Adendo 10). Fica no mesmo alvo de desktop que o
# atalho global, e pelo mesmo motivo: em Android e iOS quem atualiza o app e a
# loja, entao o plugin inteiro entraria na compilacao mobile para nao poder ser
# usado. `AppHandle::restart()` e do proprio Tauri -- `tauri-plugin-process`
# existiria aqui para expor a mesma funcao uma segunda vez.
tauri-plugin-updater = "2"

# O binario e tambem o tamanho de cada download de atualizacao (Adendo 10): sem
# este perfil, o release sai com os defaults do cargo (sem LTO, 16 unidades de
# codegen, simbolos inclusos). Os valores sao os recomendados pelo guia de
# tamanho do proprio Tauri; `opt-level = "s"` porque o app nao e CPU-bound --
# nenhum caminho quente dele passa de uma varredura de lista em memoria.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true


# --- notificacao dos lembretes (Adendo 14) ---
#
# Duas implementacoes, e a divisao NAO e preciosismo: e a diferenca entre uma API
# viva e uma morta. Ver `aviso.rs`, que registra a medicao inteira.

# Fora do macOS o plugin do Tauri serve: por baixo dele o `notify-rust` fala WinRT
# no Windows e D-Bus no Linux, que sao as APIs correntes dos dois sistemas. So
# desktop, pela mesma razao dos vizinhos acima.
[target.'cfg(all(not(any(target_os = "android", target_os = "ios")), not(target_os = "macos")))'.dependencies]
tauri-plugin-notification = "2"

# No macOS o plugin NAO serve, e foi medido: ele chama `mac-notification-sys`, que
# usa `NSUserNotification` -- a API que a Apple aposentou. No macOS 27 ela aceita a
# chamada, devolve Ok, e descarta em silencio; o app nem chega a aparecer em
# Ajustes do Sistema > Notificacoes. Falar direto com `UNUserNotificationCenter`,
# que e a API corrente, custa estes quatro crates e entrega de verdade -- inclusive
# com um estado de autorizacao REAL, que o plugin nao tem.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSBundle"] }
objc2-user-notifications = { version = "0.3", features = [
  "UNUserNotificationCenter",
  "UNNotificationRequest",
  "UNNotificationContent",
  "UNNotificationTrigger",
  "block2",
] }
